name: One-time markdown formatter
on:
  push:
    branches: [security/audit-and-preview-2026-11]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: security/audit-and-preview-2026-11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-fund
      - run: npx prettier --write docs/SECURITY-AUDIT-2026-11.md
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/SECURITY-AUDIT-2026-11.md
            git commit -m "docs: format security audit"
            git push origin HEAD:security/audit-and-preview-2026-11
          fi
