name: Format temporary feature branch

on:
  push:
    branches:
      - feat/editorial-ui-projetos-glossario-2026-11-05

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-fund
      - name: Format affected files
        run: >
          npx prettier --write
          docs/audit/editorial-v2-2026-11-05.md
          scripts/load-test.mjs
          src/app/glossario/page.tsx
          src/app/projetos/page.tsx
          src/content/legislative-terms.ts
          src/styles/tokens.css
          tests/redesign.spec.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit/editorial-v2-2026-11-05.md scripts/load-test.mjs src/app/glossario/page.tsx src/app/projetos/page.tsx src/content/legislative-terms.ts src/styles/tokens.css tests/redesign.spec.ts
          if git diff --cached --quiet; then
            echo "Already formatted"
          else
            git commit -m "style: apply Prettier to editorial v2 changes"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
