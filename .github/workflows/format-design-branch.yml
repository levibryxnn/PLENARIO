name: Format design branch

on:
  push:
    branches: [design/minimal-v2-audit]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: design/minimal-v2-audit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-fund
      - name: Format changed design files
        run: npx prettier --write scripts/load-test.mjs src/app/glossario/page.tsx src/app/projetos/page.tsx tests/design.spec.ts
      - name: Commit formatter output
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/load-test.mjs src/app/glossario/page.tsx src/app/projetos/page.tsx tests/design.spec.ts
            git commit -m "style: format redesigned components and tests"
            git push origin HEAD:design/minimal-v2-audit
          fi
