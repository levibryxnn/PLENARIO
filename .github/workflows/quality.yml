name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Check formatting
        run: npm run format:check
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run data, editorial and security tests
        run: npm test
      - name: Audit known dependency advisories
        run: npm audit --audit-level=high
      - name: Build production app
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e
      - name: Exercise 300 virtual visitors against an isolated local production server
        shell: bash
        run: |
          load_dir="$(mktemp -d)"
          export CIVIS_DB_PATH="$load_dir/load.db"
          npm run db:init
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3102 > "$load_dir/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          npm run test:load -- --base=http://127.0.0.1:3102 --users=300 --report=test-results/load-300.json || {
            cat "$load_dir/server.log"
            exit 1
          }
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
