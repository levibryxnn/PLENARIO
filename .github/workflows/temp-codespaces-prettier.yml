name: Temporary Prettier for Codespaces fix

on:
  push:
    branches:
      - fix/codespaces-layout-projetos-v3-20261105

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-fund
      - name: Format modified files
        run: npx prettier --write src/app/cargos/page.tsx tests/redesign.spec.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/cargos/page.tsx tests/redesign.spec.ts
          if git diff --cached --quiet; then
            echo "Already formatted"
          else
            git commit -m "style: normalize Codespaces fix with Prettier"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
